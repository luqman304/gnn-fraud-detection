[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gnn-fraud"
version = "1.0.0"
description = "Illicit Bitcoin transaction detection on the Elliptic dataset: temporal evaluation of feature baselines and graph neural networks, with a scoring API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.1",
    "joblib>=1.3",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
gnnfraud = "gnn_fraud.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn_fraud"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
